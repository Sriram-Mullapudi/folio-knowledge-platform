server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API and actuator to the backend service on the compose
    # network. Keeps the SPA same-origin so no CORS is needed in containers.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streaming (RAG answers): disable buffering, keep the upstream
        # connection on HTTP/1.1, and allow long-lived streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # SPA client-side routing: always serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
