spring:
  application:
    name: ekp-backend

  # ── Datasource: PostgreSQL + pgvector ───────────────────────────────
  # Every value is overridable by an environment variable so the SAME jar
  # runs locally (defaults below) and in Docker / AWS (env injected).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ekp}
    username: ${DB_USER:ekp}
    password: ${DB_PASSWORD:ekp}
    hikari:
      pool-name: ekp-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    open-in-view: false          # avoid lazy-loading surprises / held connections
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only validates
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # ── Flyway: versioned, repeatable migrations ────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis ───────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # ── Multipart uploads ───────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:30MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful             # finish in-flight requests on SIGTERM
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never    # never leak stack traces to clients
    include-exception: false

# ── Application config ─────────────────────────────────────────────────
ekp:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      # Dev-only default. MUST be overridden via JWT_SECRET in every real
      # environment. Minimum 32 bytes (256 bits) for HS256.
      secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32b+}
      issuer: ekp
      access-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-ttl: ${JWT_REFRESH_TTL:30d}
  admin:
    # First-run admin bootstrap (see AdminSeeder). Leave blank to skip.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # ── Object storage (MinIO locally, S3 in the cloud) ──────────────────
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:ekp-documents}
      access-key: ${S3_ACCESS_KEY:ekp_minio}
      secret-key: ${S3_SECRET_KEY:ekp_minio_local_dev_password}
      path-style-access: ${S3_PATH_STYLE:true}
      auto-create-bucket: ${S3_AUTO_CREATE_BUCKET:true}
  documents:
    max-file-size: ${MAX_FILE_SIZE:25MB}
    # Chunking is measured in characters (~4 chars per token for English).
    chunk-size: ${CHUNK_SIZE:1000}
    chunk-overlap: ${CHUNK_OVERLAP:150}
  processing:
    # Async pipeline pool. Backlog beyond this applies backpressure (caller-runs).
    core-pool-size: ${PROCESSING_CORE_POOL:2}
    max-pool-size: ${PROCESSING_MAX_POOL:4}
    queue-capacity: ${PROCESSING_QUEUE_CAPACITY:100}
  # ── Embeddings (OpenAI-compatible) ───────────────────────────────────
  # Disabled by default so the stack runs with no API key; chunks are stored
  # un-embedded and picked up automatically once a key is configured.
  embedding:
    enabled: ${EMBEDDINGS_ENABLED:false}
    base-url: ${EMBEDDING_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com/v1}}
    api-key: ${EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
    model: ${EMBEDDING_MODEL:text-embedding-3-small}
    # MUST equal the vector() column size in V5 (1536 for text-embedding-3-small).
    dimensions: ${EMBEDDING_DIMENSIONS:1536}
    batch-size: ${EMBEDDING_BATCH_SIZE:96}
    requests-per-minute: ${EMBEDDING_RPM:3000}
    max-retries: ${EMBEDDING_MAX_RETRIES:5}
    initial-backoff: ${EMBEDDING_INITIAL_BACKOFF:500ms}
    max-backoff: ${EMBEDDING_MAX_BACKOFF:20s}
    connect-timeout: ${EMBEDDING_CONNECT_TIMEOUT:5s}
    read-timeout: ${EMBEDDING_READ_TIMEOUT:30s}
  # ── RAG answer generation (OpenAI-compatible chat) ───────────────────
  generation:
    enabled: ${GENERATION_ENABLED:false}
    base-url: ${GENERATION_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com/v1}}
    api-key: ${GENERATION_API_KEY:${OPENAI_API_KEY:}}
    model: ${GENERATION_MODEL:gpt-4o-mini}
    max-output-tokens: ${GENERATION_MAX_TOKENS:800}
    temperature: ${GENERATION_TEMPERATURE:0.2}
    connect-timeout: ${GENERATION_CONNECT_TIMEOUT:10s}
    max-retries: ${GENERATION_MAX_RETRIES:3}
    initial-backoff: ${GENERATION_INITIAL_BACKOFF:500ms}
    max-backoff: ${GENERATION_MAX_BACKOFF:8s}
    retrieval-k: ${RAG_RETRIEVAL_K:6}
    max-context-chars: ${RAG_MAX_CONTEXT_CHARS:8000}

# ── Actuator / observability ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness & /readiness
      show-details: always      # DEV: show db/redis component health.
                                # Lock to "when_authorized" once auth lands.
  health:
    redis:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: Enterprise Knowledge Platform
    module: backend
    version: 0.1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.ekp: ${LOG_LEVEL_APP:DEBUG}
    org.flywaydb: INFO
