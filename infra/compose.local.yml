name: ekp-development
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ekp
      POSTGRES_USER: ekp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports: ["127.0.0.1:${LOCAL_DB_PORT:-25432}:5432"]
    volumes: ["dev-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekp -d ekp"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: ${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ekp_local
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["dev-minio:/data"]
  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["dev-ollama:/root/.ollama"]
    environment:
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: "15m"
    mem_limit: 5g
volumes:
  dev-ollama:
  dev-postgres:
  dev-minio:
